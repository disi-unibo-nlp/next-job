[project]
name = "handoff-shared"
version = "0.1.0"
description = "Shared dataset preparation and retrieval evaluation for the handoff recipes"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.4.0",
    "transformers==4.56.2",
    "sentence-transformers>=5.0",
    "datasets==4.3.0",
    "huggingface_hub>=0.34.0",
    "hf_transfer",
    "sentencepiece",
    "protobuf",
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
# Needed by `evaluate.py --backend late-interaction` (recipe 02).
late-interaction = [
    "pylate",
]
# Needed by `prepare_data.py --use-faiss`.
faiss = [
    "faiss-cpu",
]

[tool.uv]
# This directory is a script collection, not an installable package.
package = false
