[project]
name = "handoff-bge-m3-flagembedding"
version = "0.1.0"
description = "BGE-M3 fine-tuning with FlagEmbedding (dense + sparse + ColBERT heads)"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.4.0",
    "transformers==4.56.2",
    "sentence-transformers>=5.0",
    "datasets==4.3.0",
    "FlagEmbedding",
    "deepspeed",
    "accelerate>=0.33",
    "huggingface_hub>=0.34.0",
    "hf_transfer",
    "sentencepiece",
    "protobuf",
    "numpy",
    "tqdm",
    "wandb",
]

[tool.uv]
# This directory is a script collection, not an installable package.
package = false
